pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.7'
}

rootProject.name = 'riichi_mahjong'

include 'themahjong'
include 'neoforge'

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create('neoforge') {
        versions '26.1.2', '26.2'
        vcsVersion = '26.2'
    }
}
